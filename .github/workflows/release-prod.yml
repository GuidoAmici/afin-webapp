# Se dispara de dos formas:
#
#   1. Automático: stg-ci.yml lo invoca (workflow_call) tras terminar verde en
#      un push a stg — PERO sólo si el diff prod..stg NO trae migraciones
#      nuevas. Un cambio de landing, copy o UI sale solo; uno que toca la base
#      espera a un humano. La diferencia es la reversibilidad: el código se
#      revierte con un merge, una migración aplicada a la DB de producción no.
#   2. A mano (workflow_dispatch), que ignora ese gate: es la vía para los
#      releases con migraciones, y la que se usa cuando se quiere mirar antes.
#
# Antes esto se disparaba por el evento `pull_request: closed` en stg,
# filtrando por head_ref del Release PR — acoplado a que GitHub dispare ese
# evento y a que el nombre matchee. `workflow_call` desde el mismo run que ya
# deployó a stg es más confiable (ver docs/adr).
#
# El gate vive en el job `gate`. Si frena, deja escrito en el summary qué
# migraciones lo frenaron y cómo disparar el release a mano.
name: Release — promote stg → prod

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      automatico:
        description: "Si es true, aplica el gate de migraciones."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Un cambio de copy y una migración de esquema no son el mismo riesgo: el
  # código se revierte con un merge, una migración aplicada a la DB de producción
  # no. El gate deja salir solo al primero y manda el segundo a un humano.
  gate:
    name: ¿Sale solo o espera a un humano?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seguir: ${{ steps.decidir.outputs.seguir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decidir
        id: decidir
        run: |
          # En una llamada desde stg-ci.yml, `automatico` llega true y el gate
          # aplica. En un workflow_dispatch el input no existe, así que un
          # humano decidió salir: el gate no aplica.
          if [ "${{ inputs.automatico }}" != "true" ]; then
            echo "seguir=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: el gate de migraciones no aplica." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Fail-closed a propósito: si el fetch o el diff fallan, el paso corta
          # y `seguir` nunca se escribe, así que el release NO sale. Un gate que
          # perdió la capacidad de mirar tiene que frenar, no dejar pasar.
          set -euo pipefail
          git fetch origin prod stg --quiet
          git rev-parse --verify origin/prod >/dev/null
          git rev-parse --verify origin/stg >/dev/null

          COMMITS=$(git rev-list --count origin/prod..origin/stg)
          if [ "$COMMITS" -eq 0 ]; then
            echo "seguir=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Nada que releasear"
              echo "\`prod\` ya tiene todo lo de \`stg\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MIGRACIONES=$(git diff --name-only origin/prod..origin/stg -- supabase/migrations)

          if [ -z "$MIGRACIONES" ]; then
            echo "seguir=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Sale solo"
              echo "$COMMITS commit(s) y ninguna migración en \`prod..stg\`. Release automático."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "seguir=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Espera a un humano"
              echo "El diff \`prod..stg\` trae migraciones, que no se revierten con un merge:"
              echo '```'
              echo "$MIGRACIONES"
              echo '```'
              echo "Para salir igual:"
              echo '```bash'
              echo "gh workflow run release-prod.yml --repo ${GITHUB_REPOSITORY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  db-migration-prod:
    name: DB migration prod
    needs: gate
    if: needs.gate.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stg
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Ver la nota en stg-ci.yml: sin password de DB, sólo el PAT.
      - name: Aplicar migraciones a prod
        run: node scripts/db-push.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.AFIN_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: myzngskhjnrmnonrksmj

  merge-to-prod:
    name: Merge stg → prod
    needs: db-migration-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Merge stg → prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout prod
          git pull origin prod
          git merge origin/stg --no-ff -m "chore: promote stg → prod (${GITHUB_SHA::7})"
          git push origin prod

  promote-prod:
    name: Promote stg deployment → afinsrl.com.ar
    needs: merge-to-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm install -g vercel@latest
      - name: Obtener deployment ID de stg.afinsrl.com.ar
        id: stg-deploy
        run: |
          DEPLOY_ID=$(curl -sf "https://api.vercel.com/v3/now/aliases/stg.afinsrl.com.ar" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | jq -r '.deploymentId')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "::error::No se pudo obtener el deployment ID de stg.afinsrl.com.ar"
            exit 1
          fi
          echo "id=$DEPLOY_ID" >> $GITHUB_OUTPUT
      - name: Promover a afinsrl.com.ar
        run: |
          vercel alias set ${{ steps.stg-deploy.outputs.id }} afinsrl.com.ar \
            --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
