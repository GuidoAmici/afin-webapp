# D8 (issue #11) + release-please (ADR-0006, ADR-0007): release stg → prod.
# Database-first (ADR-0001): las migraciones se aplican a la DB de prod ANTES
# del merge de código — si fallan, prod no se toca.
#
# Se dispara de dos formas:
#
#   1. Automático: stg-ci.yml lo invoca (workflow_call) tras terminar verde en
#      un push a stg — PERO sólo si el diff prod..stg NO trae migraciones
#      nuevas. Un cambio de landing, copy o UI sale solo; uno que toca la base
#      espera a un humano. La diferencia es la reversibilidad: el código se
#      revierte con un merge, una migración aplicada a la DB de producción no.
#   2. A mano (workflow_dispatch), que ignora ese gate: es la vía para los
#      releases con migraciones, y la que se usa cuando se quiere mirar antes.
#
# El gate vive en el job `gate`. Si frena, deja escrito en el summary qué
# migraciones lo frenaron y cómo disparar el release a mano.
#
# `closed` en un issue quiere decir "mergeado a stg", no "en producción" — stg
# es la rama default (autocierra por keyword) y eso incluye a la IA, que lee
# el tracker antes que el código. La distancia entre las dos cosas la marca el
# label `en-prod`: el paso final del job `release` recorre los PRs recién
# mergeados a `prod` en este run, sigue el `closingIssuesReferences` de cada
# uno (lo que GitHub ya calculó a partir de "Closes #N" en el PR) y etiqueta +
# comenta cada issue con la versión que lo llevó a producción.
name: Release → prod

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      automatico:
        description: "Si es true, aplica el gate de migraciones."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  gate:
    name: ¿Sale solo o espera a un humano?
    runs-on: ${{ (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    outputs:
      seguir: ${{ steps.decidir.outputs.seguir || steps.vacio.outputs.seguir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Contar migraciones de prod..stg
        id: contar
        env:
          AUTOMATICO: ${{ inputs.automatico }}
        run: |
          # En un workflow_dispatch el input no existe, así que un humano decidió
          # salir: el gate no aplica y no hace falta mirar el diff.
          if [ "$AUTOMATICO" != "true" ]; then
            exit 0
          fi

          # Fail-closed a propósito: si el fetch o el diff fallan, el paso corta,
          # MIGRACIONES_PENDIENTES nunca se escribe y el gate frena. Un gate que
          # perdió la capacidad de mirar tiene que frenar, no dejar pasar.
          set -euo pipefail
          git fetch origin prod stg --quiet
          git rev-parse --verify origin/prod >/dev/null
          git rev-parse --verify origin/stg >/dev/null

          COMMITS=$(git rev-list --count origin/prod..origin/stg)
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"

          MIGRACIONES=$(git diff --name-only origin/prod..origin/stg -- supabase/migrations)
          if [ -z "$MIGRACIONES" ]; then
            echo "migraciones=0" >> "$GITHUB_OUTPUT"
          else
            echo "migraciones=$(echo "$MIGRACIONES" | wc -l)" >> "$GITHUB_OUTPUT"
            {
              echo "## Migraciones en \`prod..stg\`"
              echo '```'
              echo "$MIGRACIONES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nada que releasear
        id: vacio
        if: inputs.automatico == true && steps.contar.outputs.commits == '0'
        run: |
          echo "seguir=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Nada que releasear"
            echo "\`prod\` ya tiene todo lo de \`stg\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # La decisión vive en scripts/release-gate.mjs (con tests), no inline.
      - name: Decidir
        id: decidir
        if: steps.vacio.outcome == 'skipped'
        env:
          AUTOMATICO: ${{ inputs.automatico }}
          MIGRACIONES_PENDIENTES: ${{ steps.contar.outputs.migraciones }}
        run: |
          node scripts/release-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Checks + migraciones prod + merge stg → prod
    needs: gate
    if: needs.gate.outputs.seguir == 'true'
    runs-on: ${{ (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    # Donde viven los secretos de la DB de prod y donde irían las reglas de aprobación.
    environment: prod
    steps:
      # El ruleset «Protect stg and prod» sólo deja pushear a prod a la GitHub App
      # (bypass): con github.token el push al final del job sería rechazado.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stg
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Sin esto setup-node autodetecta npm y, en el runner propio, su paso Post empaqueta
          # todo ~/.npm (3 GB) y se cuelga: el job termina verde y el runner queda ocupado.
          package-manager-cache: false
          # En el runner propio, sin caché: subiría todo ~/.npm del usuario (se colgó 16 min).
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migraciones → AFIN DB prod
        run: node scripts/db-push.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.AFIN_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: myzngskhjnrmnonrksmj
      - name: Merge stg → prod
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin prod
          # Se guarda ANTES del merge: es el extremo viejo del rango que se está
          # promoviendo. Después del push, prod == stg y el rango ya no se puede
          # reconstruir desde el estado del repo.
          echo "prod_antes=$(git rev-parse origin/prod)" >> "$GITHUB_OUTPUT"
          git checkout prod
          git merge origin/stg --no-ff -m "release: stg → prod (${GITHUB_SHA::7})"
          git push origin prod

      - name: Etiquetar issues promovidos como en-prod
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_ANTES: ${{ steps.merge.outputs.prod_antes }}
        run: |
          # No fail-fast: un issue que no se puede etiquetar (label borrado, PR
          # de otro repo, o un número que resultó ser un issue y no un PR) no
          # debe tumbar un release que ya se aplicó. Mejor una etiqueta que
          # falta que un merge revertido.
          #
          # El patrón de subject varía según cómo se mergeó cada PR a stg (squash
          # deja "... (#NN)"; merge commit deja "Merge pull request #NN from ...");
          # se extrae cualquier "#NN" del subject y se prueba como número de PR.
          # `gh pr view` sobre un número que resulta ser un issue falla solo y
          # se ignora — heurística tolerante a falsos positivos, no exacta.
          VERSION="v$(node -p "require('./package.json').version")"
          PRS=$(git log "${PROD_ANTES}..HEAD" --format=%s \
            | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | sort -un)

          if [ -z "$PRS" ]; then
            echo "Sin referencias a PR/issue en el rango promovido."
            exit 0
          fi

          for PR in $PRS; do
            ISSUES=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number' 2>/dev/null || true)
            for ISSUE in $ISSUES; do
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label en-prod \
                || echo "::warning::no se pudo etiquetar #$ISSUE (PR #$PR) — label en-prod inexistente o issue en otro repo"
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "Promovido a producción en \`afin-webapp $VERSION\` (release: stg → prod, $(date -u +%Y-%m-%d))." \
                || true
            done
          done

  deploy-prod:
    name: Deploy prod → Vercel
    needs: release
    runs-on: ${{ (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Vercel sin configurar → skip
        if: env.HAS_VERCEL != 'true'
        run: echo "VERCEL_TOKEN no esta configurado - el deploy se activa con el issue 12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_VERCEL == 'true'
        with:
          ref: prod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_VERCEL == 'true'
        with:
          node-version: 24
          # Sin esto setup-node autodetecta npm y, en el runner propio, su paso Post empaqueta
          # todo ~/.npm (3 GB) y se cuelga: el job termina verde y el runner queda ocupado.
          package-manager-cache: false
      - name: Deploy production
        if: env.HAS_VERCEL == 'true'
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Cierra el círculo: recién desplegado, se comprueba que las URLs impresas
      # en papel resuelvan de verdad. Es el único paso que mira producción con
      # los ojos de quien escanea un QR. Va como paso y no como workflow
      # anidado: es un `node script` y no justifica un tercer nivel.
      - name: Smoke — rutas impresas
        if: env.HAS_VERCEL == 'true'
        run: |
          echo "Esperando a que propague el deploy..."
          sleep 30
          node scripts/smoke-rutas-impresas.mjs

      # El bundle de Production nunca debe apuntar a la base de stg. Si el build se
      # hizo con las variables del entorno equivocado, la web le hablaría a stg.
      - name: Verificar que el bundle no apunte a la base de stg
        if: env.HAS_VERCEL == 'true'
        run: |
          STG_REF=wbsvxdquzvsawmjoiwat
          FALLAS=0
          for URL in https://afinsrl.com.ar/ https://www.afinsrl.com.ar/; do
            echo "Revisando $URL"
            HTML=$(curl -fsSL --retry 5 --retry-delay 10 "$URL") \
              || { echo "::error::No se pudo bajar $URL"; FALLAS=1; continue; }
            CHUNKS=$(echo "$HTML" | grep -oE '/_next/static/chunks/[^"'"'"' )\\]+\.js' | sort -u)
            if [ -z "$CHUNKS" ]; then
              echo "::error::$URL no referencia ningún chunk de /_next/static/chunks/: no se puede verificar el bundle"
              FALLAS=1
              continue
            fi
            echo "$HTML" | grep -q "$STG_REF" \
              && { echo "::error::$URL (HTML) referencia la base de stg $STG_REF"; FALLAS=1; }
            for CHUNK in $CHUNKS; do
              if curl -fsSL --retry 3 "${URL%/}$CHUNK" | grep -q "$STG_REF"; then
                echo "::error::${URL%/}$CHUNK referencia la base de stg $STG_REF — Production se construyó con las variables de stg"
                FALLAS=1
              fi
            done
          done
          if [ "$FALLAS" -ne 0 ]; then
            echo "::error::Production no es confiable: revisar las variables de entorno de Production en Vercel y re-desplegar."
            exit 1
          fi
          echo "OK: ningún chunk de afinsrl.com.ar ni www.afinsrl.com.ar referencia $STG_REF"
