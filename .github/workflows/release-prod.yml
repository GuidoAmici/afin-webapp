name: Release — promote stg → prod

on:
  pull_request:
    types: [closed]
    branches:
      - stg
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  db-migration-prod:
    name: DB migration prod
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release-please--branches--stg'))
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stg
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Ver la nota en dev-ci.yml: sin password de DB, sólo el PAT.
      - name: Aplicar migraciones a prod
        run: node scripts/db-push.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.AFIN_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: myzngskhjnrmnonrksmj

  merge-to-prod:
    name: Merge stg → prod
    needs: db-migration-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Merge stg → prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout prod
          git pull origin prod
          TITLE="${{ github.event.pull_request.title }}"
          MESSAGE="chore: promote stg → prod${TITLE:+ ($TITLE)}"
          git merge origin/stg --no-ff -m "$MESSAGE"
          git push origin prod

  promote-prod:
    name: Promote stg deployment → afinsrl.com.ar
    needs: merge-to-prod
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g vercel@latest
      - name: Obtener deployment ID de stg.afinsrl.com.ar
        id: stg-deploy
        run: |
          DEPLOY_ID=$(curl -sf "https://api.vercel.com/v3/now/aliases/stg.afinsrl.com.ar" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | jq -r '.deploymentId')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "::error::No se pudo obtener el deployment ID de stg.afinsrl.com.ar"
            exit 1
          fi
          echo "id=$DEPLOY_ID" >> $GITHUB_OUTPUT
      - name: Promover a afinsrl.com.ar
        run: |
          vercel alias set ${{ steps.stg-deploy.outputs.id }} afinsrl.com.ar \
            --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
