name: Dev CI — Playwright + Auto-merge a stg

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  lint:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar htmlhint
        run: npm install --global htmlhint@latest --silent

      - name: Lint HTML
        run: htmlhint "**/*.html"

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t afin-website:ci .

  playwright:
    name: Playwright tests
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar browsers de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests
        run: npx playwright test

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  merge-to-stg:
    name: Merge dev → stg
    needs: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev → stg
        run: |
          git checkout stg
          git merge origin/dev --no-ff -m "chore: auto-merge dev → stg [skip ci]"
          git push origin stg
