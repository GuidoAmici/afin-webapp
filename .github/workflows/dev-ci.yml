name: Dev CI — lint + preview + migration + E2E + promote stg

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Restaurar node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  pgtap:
    name: pgTAP (transition_order + RLS)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      # Stack local desde cero: aplica TODAS las migraciones a una DB vacía
      # (garantiza reproducibilidad) y corre supabase/tests/*.sql. No toca la DB
      # de test ni prod: la frontera RLS se valida antes de migrar nada.
      - name: Levantar Postgres local y correr la suite pgTAP
        run: |
          supabase db start
          supabase test db
      # Database-first: los tipos commiteados tienen que coincidir con el schema
      # que producen las migraciones. Se genera desde el stack LOCAL —con las
      # migraciones de ESTE commit ya aplicadas por `db start`— y se compara con
      # el archivo del repo. Antes `gen-types` apuntaba al proyecto remoto, así
      # que los tipos podían coincidir con un cambio hecho a mano en la DB que no
      # estaba en supabase/migrations/. `--no-index` da un diff legible y sale
      # con código != 0 si hay drift.
      - name: Tipos generados = migraciones (database-first)
        run: |
          supabase gen types typescript --local > /tmp/types.generated.ts
          git --no-pager diff --no-index --exit-code lib/database.types.ts /tmp/types.generated.ts

  deploy-preview:
    name: Build + Deploy preview dev → Vercel
    needs: db-test-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.verify.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          RESULT=$(vercel deploy --prebuilt --no-wait --json --token=${{ secrets.VERCEL_TOKEN }})
          if ! echo "$RESULT" | jq -e '.id' > /dev/null 2>&1; then
            echo "::error::vercel deploy no devolvió JSON válido: $RESULT"
            exit 1
          fi
          echo "id=$(echo "$RESULT" | jq -r '.id')" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verificar deployment READY
        id: verify
        run: |
          for i in $(seq 1 20); do
            RESPONSE=$(curl -sf "https://api.vercel.com/v13/deployments/${{ steps.deploy.outputs.id }}?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
            STATE=$(echo "$RESPONSE" | jq -r '.readyState')
            echo "Intento $i — estado: $STATE"
            if [ "$STATE" = "READY" ]; then
              URL=$(echo "$RESPONSE" | jq -r '.url')
              echo "url=https://$URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            [ "$STATE" = "ERROR" ] && echo "::error::El deployment terminó en ERROR" && exit 1
            [ "$STATE" = "CANCELED" ] && echo "::error::El deployment fue cancelado" && exit 1
            [ "$STATE" = "null" ] && echo "::error::Respuesta inválida de Vercel API: $RESPONSE" && exit 1
            sleep 15
          done
          echo "::error::Timeout: el deployment preview no llegó a READY en 5 minutos" && exit 1

  db-test-migration:
    name: DB test migration
    needs: lint
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Management API + PAT en vez de `supabase link --password`: migrar no
      # necesita la credencial de mayor privilegio del proyecto, y ésa no tiene
      # por qué pasar por un runner. db-push.mjs aplica cada migración junto con
      # su registro en el historial, en una sola transacción.
      - name: Aplicar migraciones a la DB de test
        run: node scripts/db-push.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.AFIN_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wbsvxdquzvsawmjoiwat

  playwright:
    name: Playwright E2E (preview URL + test DB)
    needs: [deploy-preview, db-test-migration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Restaurar node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Restaurar browsers de Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Versión de Playwright instalada
        run: npx playwright --version
      - name: Instalar browsers (solo si no hay caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Correr tests contra preview
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  merge-to-stg:
    name: Merge dev → stg
    needs: [playwright, pgtap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge dev → stg
        run: |
          git checkout stg
          git merge origin/dev --no-ff -X theirs -m "chore: auto-merge dev → stg"
          git push origin stg

  promote-stg:
    name: Promote preview → stg.afinsrl.com.ar
    needs: [deploy-preview, merge-to-stg]
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g vercel@latest
      - name: Desvincular stg.afinsrl.com.ar de git branch
        run: |
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/domains/stg.afinsrl.com.ar?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"gitBranch": null}'
      - name: Asignar alias stg al deployment preview
        run: |
          curl -sf -X POST \
            "https://api.vercel.com/v2/deployments/${{ needs.deploy-preview.outputs.deployment_id }}/aliases?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"alias": "stg.afinsrl.com.ar"}'

  release-please:
    name: Release PR → stg
    needs: promote-stg
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: stg

  vercel-deployment:
    name: Deployment de la integración Vercel
    # POR QUÉ EXISTE ESTE JOB: hay DOS caminos de deploy corriendo en paralelo
    # sobre el mismo commit — el job `deploy-preview` de arriba (`vercel build` +
    # `vercel deploy --prebuilt`, en el runner) y la integración nativa
    # GitHub↔Vercel, que buildea en la infra de Vercel con su adapter. NO son
    # equivalentes: en newhaze-webapp el bump a Next 16.3.2 pasó los siete jobs
    # en verde mientras la integración fallaba con ENOENT en
    # `.next/next-server.js.nft.json` (vercel/next.js#96646), porque el paso que
    # rompe sólo existe del lado de Vercel. Nadie miraba ese ❌ salvo el
    # comentario del bot.
    #
    # NO bloquea el deploy: corre en paralelo y sólo observa. Si la integración
    # está desactivada o todavía no creó el deployment, termina neutro — no
    # inventa un fallo donde no hay señal.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Este job no necesita el `contents: write` del workflow, sólo leer
    # deployments. Declararlo acá lo deja en el mínimo.
    permissions:
      deployments: read
    steps:
      - name: Esperar el estado del deployment de la integración
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            IDS=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA" --jq '.[].id' || echo "")
            if [ -z "$IDS" ]; then
              echo "Sin deployments de la integración para $SHA todavía (intento $i/30)"
              sleep 20
              continue
            fi
            PENDIENTE=0
            for id in $IDS; do
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // "pending"')
              echo "deployment $id → $STATE"
              case "$STATE" in
                failure|error)
                  echo "::error::El deployment $id de la integración Vercel falló ($STATE). Revisar el build en Vercel — el deploy por CLI puede estar verde y este no."
                  exit 1
                  ;;
                success|inactive) ;;
                *) PENDIENTE=1 ;;
              esac
            done
            if [ "$PENDIENTE" -eq 0 ]; then
              echo "Todos los deployments de la integración terminaron OK."
              exit 0
            fi
            sleep 20
          done
          echo "::notice::La integración Vercel no llegó a un estado terminal en 10 min — sin señal, no se falla el job."
