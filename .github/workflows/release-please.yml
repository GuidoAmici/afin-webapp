name: Release Please (manual)

# Este workflow se disparó originalmente en push a stg, pero GITHUB_TOKEN
# no puede triggerear otros workflows. La automatización real está en
# dev-ci.yml (job release-please, corre después del merge a stg).
# Este workflow existe solo para disparos manuales si es necesario.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release PR stg → prod
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: prod
